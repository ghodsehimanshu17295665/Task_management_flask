<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Task Status</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!-- Header Section -->
    <header style="background-color: #003366; color: white; padding: 10px 20px;">
        <h1>Task Management System</h1>
    </header>

    <div class="container my-5">
        <!-- Main Task Details -->
        <h2>Update Task Status</h2>
        <div class="mb-3">
            <h4>Main Task: {{ task.title }}</h4>
            <p>Current Status: <strong>{{ task.status }}</strong></p>
        </div>

        <!-- Form for updating task status -->
        <form method="POST">
            {{ form.hidden_tag() }}

            <div class="mb-3">
                <label for="task_status">Update Task Status</label>
                {{ form.status(class="form-control") }}
            </div>

            <button type="submit" class="btn btn-success">Save Changes</button>
        </form>

        <!-- Back Button -->
        <a href="{{ url_for('dashboard.dashboard') }}" class="btn btn-secondary mt-3">Back to Task List</a>
    </div>
</body>
</html>
